name: Build OnePlus 7T Pro NetHunter Kernel

on:
  workflow_dispatch: # Allows you to manually click a button to start the build

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - name: Maximize Build Space
      uses: easimon/maximize-build-space@v10
      with:
        root-reserve-mb: 5120
        swap-size-mb: 1024
        remove-dotnet: 'true'
        remove-android: 'true'
        remove-haskell: 'true'

    - name: Checkout Kernel Source
      uses: actions/checkout@v4
      with:
        repository: 'V0lk3n/nethunter_kernel_oneplus_sm8150'
        ref: 'nethunter-lineage-23.2'
        submodules: 'recursive'

    - name: Set Up Build Environment
      run: |
        sudo apt-get update
        sudo apt-get install -y bc bison build-essential ccache curl flex g++-multilib gcc-multilib git gnupg gperf lib32readline-dev lib32z1-dev liblz4-tool libncurses-dev libssl-dev libxml2 libxml2-utils lzop pngcrush rsync schedtool squashfs-tools xsltproc zip zlib1g-dev

    - name: Download Proton Clang Toolchain
      run: |
        curl -LO https://github.com/kdrag0n/proton-clang/archive/refs/heads/master.zip
        unzip master.zip
        mv proton-clang-master clang

    - name: Compile Kernel
      run: |
        export PATH=$GITHUB_WORKSPACE/clang/bin:$PATH
        export ARCH=arm64
        export SUBARCH=arm64
        export CROSS_COMPILE=aarch64-linux-gnu-
        export CROSS_COMPILE_ARM32=arm-linux-gnueabi-
        export CC=clang
        export LD=ld.lld
        export AR=llvm-ar
        export NM=llvm-nm
        export OBJCOPY=llvm-objcopy
        export OBJDUMP=llvm-objdump
        export STRIP=llvm-strip
        
        chmod +x build.sh
        ./build.sh

    - name: Upload Flashable Kernel Zip
      uses: actions/upload-artifact@v4
      with:
        name: AnyKernel3-oneplus7-los-23.2
        path: AnyKernel3/*.zip
