name: Build OnePlus 7T Pro NetHunter Kernel

on:
  workflow_dispatch: # Allows you to manually click a button to start the build

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - name: Maximize Build Space
      uses: easimon/maximize-build-space@v10
      with:
        root-reserve-mb: 5120
        swap-size-mb: 1024
        remove-dotnet: 'true'
        remove-android: 'true'
        remove-haskell: 'true'

    - name: Checkout Kernel Source
      uses: actions/checkout@v4
      with:
        repository: 'V0lk3n/nethunter_kernel_oneplus_sm8150'
        ref: 'nethunter-lineage-23.2'
        submodules: 'recursive'

    - name: Set Up Build Environment
      run: |
        sudo apt-get update
        # ADDED: Added device-tree-compiler (dtc) to ensure hardware trees compile cleanly without path errors
        sudo apt-get install -y bc bison build-essential ccache curl flex g++-multilib gcc-multilib git gnupg gperf lib32readline-dev lib32z1-dev liblz4-tool libncurses-dev libssl-dev libxml2 libxml2-utils lzop pngcrush rsync schedtool squashfs-tools xsltproc zip zlib1g-dev device-tree-compiler
        
        # Link modern system libraries to satisfy legacy dependencies natively on Ubuntu 24.04
        sudo ln -sf /usr/lib/x86_64-linux-gnu/libtinfo.so.6 /usr/lib/x86_64-linux-gnu/libtinfo.so.5

    - name: Download Pre-compiled AOSP Kernel Toolchain
      run: |
        mkdir -p tc/clang
        cd tc/clang
        curl -L -s -o aosp_clang.tar.gz "https://googlesource.com"
        tar -xzf aosp_clang.tar.gz
        rm aosp_clang.tar.gz

    - name: Compile Kernel
      run: |
        export ARCH=arm64
        export SUBARCH=arm64
        export PATH=$GITHUB_WORKSPACE/tc/clang/bin:$PATH
        
        export CROSS_COMPILE=aarch64-linux-gnu-
        export CLANG_TRIPLE=aarch64-linux-gnu-
        export CC=clang
        export LD=ld.lld
        
        mkdir -p out
        make O=out clean
        make O=out mrproper
        
        if [ -f arch/arm64/configs/vendor/sm8150-perf_defconfig ]; then
          make O=out vendor/sm8150-perf_defconfig
        elif [ -f arch/arm64/configs/guacamole_defconfig ]; then
          make O=out guacamole_defconfig
        else
          make O=out defconfig
        fi
        
        if [ -f arch/arm64/configs/vendor/oplus.config ]; then
          cat arch/arm64/configs/vendor/oplus.config >> out/.config
          make O=out oldconfig
        fi
        
        make -j$(nproc --all) O=out
        
        if [ -d AnyKernel3 ]; then
          cp out/arch/arm64/boot/Image.gz-dtb AnyKernel3/ || cp out/arch/arm64/boot/Image.gz AnyKernel3/
          cd AnyKernel3 && zip -r9 ../nethunter-kernel-hotdog.zip *
        else
          cd out/arch/arm64/boot/ && zip -r9 ../../../../nethunter-kernel-hotdog.zip .
        fi
        
    - name: Upload Flashable Kernel Zip
      uses: actions/upload-artifact@v4
      with:
        name: NetHunter-Kernel-oneplus7-hotdog
        path: "*.zip"
